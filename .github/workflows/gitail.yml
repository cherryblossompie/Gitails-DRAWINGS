name: gitail
# Part 6 — on PR: sync check, index rebuild, before/after comment, fuzzy review flag.
on:
  pull_request:
    paths: ["drawings/**", "state/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gitail tool
        run: |
          pip install "git+https://github.com/cherryblossompie/Gitails-Tools.git"
          gitail --help

      - name: Fetch tool config (materials/layers)
        run: |
          git clone --depth 1 https://github.com/cherryblossompie/Gitails-Tools.git /tmp/tool
          ls /tmp/tool/config

      - name: Sync check (fail if DXF committed without extract/render)
        run: |
          fail=0
          find drawings -name '*.dxf' | while read dxf; do
            echo "--- check $dxf"
            gitail extract "$dxf" --state-dir state --drawings-dir drawings --config-dir /tmp/tool/config --check || fail=1
          done
          gitail render --drawings-dir drawings --pdf-dir pdf --check || fail=1
          exit $fail

      - name: Build index + report
        run: |
          gitail index --repo . --db /tmp/index.sqlite
          gitail render --drawings-dir drawings --pdf-dir /tmp/pdf
          gitail report --db /tmp/index.sqlite --html report.html --markdown report.md --pdf-dir /tmp/pdf
          ls -la /tmp/index.sqlite report.html report.md

      - name: Build PR comment
        id: comment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          out = subprocess.run(["gitail", "changed", "--from", base, "--to", head,
                                "--db", "/tmp/index.sqlite", "--json"],
                               capture_output=True, text=True)
          try:
              changes = json.loads(out.stdout or "[]")
          except json.JSONDecodeError:
              changes = []
          # fuzzy reviews: re-run extract live to temp and collect REVIEW lines
          import glob
          fuzzy = []
          for dxf in glob.glob("drawings/**/*.dxf", recursive=True):
              p = subprocess.run(["gitail", "extract", dxf, "--state-dir", "/tmp/fxstate",
                                  "--drawings-dir", "drawings",
                                  "--config-dir", "/tmp/tool/config"],
                                 capture_output=True, text=True)
              # seed temp state with committed state so IDs resolve like CI sees them
              for line in (p.stdout + p.stderr).splitlines():
                  if line.startswith("REVIEW fuzzy:"):
                      fuzzy.append(f"{dxf}: {line}")
          # NOTE: live extract above runs against committed state on first file;
          # tier-3 flags here are advisory — drafters confirm in the PR thread.
          with open("pr_comment.md", "w") as f:
              f.write("## gitail review\n\n")
              if not changes:
                  f.write("No element changes detected.\n\n")
              else:
                  from collections import defaultdict
                  by_drw = defaultdict(list)
                  for c in changes:
                      by_drw[c["drawing"]].append(c)
                  for drw in sorted(by_drw):
                      f.write(f"### {drw}\n\n")
                      f.write("| element | change | before | after |\n")
                      f.write("|---|---|---|---|\n")
                      for c in by_drw[drw]:
                          b, a = c.get("before") or {}, c.get("after") or {}
                          def fmt(r):
                              if not r: return "—"
                              return f"{r.get('material') or ''} {r.get('value') or ''} `{r.get('text_raw') or ''}`".strip()
                          f.write(f"| `{c['element_id']}` | {c['change']} | {fmt(b)} | {fmt(a)} |\n")
                      f.write("\n")
              f.write("### Fuzzy matches needing human review\n\n")
              if fuzzy:
                  for line in fuzzy:
                      f.write(f"- ⚠️ {line}\n")
              else:
                  f.write("None.\n")
          print(f"changes={len(changes)} fuzzy={len(fuzzy)}")
          PY
          cat pr_comment.md

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr_comment.md', 'utf8');
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body
            });

      - name: Upload static search report
        uses: actions/upload-artifact@v4
        with:
          name: gitail-report
          path: |
            report.html
            report.md
            pdf/**/*.pdf
